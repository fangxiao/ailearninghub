            </button>

              <div class="font-bold text-white group-hover:text-indigo-300">💻 代码重构审计</div>

              <div class="text-[10px] text-slate-400 truncate">带约束的自治智能体</div>

  <script>

            personality: "专业严谨、逻辑清晰、结构化表述，杜绝空泛口号，严格采用规范字段",

          }
        },
        report: {
          framework: "crispe",
          values: {
            capacity: "顶级咨询公司（麦肯锡/波士顿咨询）科技与大模型行业主任分析师",

              <div>
                <label class="block text-xs font-bold text-indigo-300 mb-1.5">Objective · 最终目标</label>
                <input type="text" data-key="objective" value="${state.values.objective || ""}" placeholder="明确希望 AI 达成的核心商业目标..." class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white">
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-indigo-300 mb-1.5">Style · 写作风格</label>
                  <input type="text" data-key="style" value="${state.values.style || ""}" placeholder="例如：短句断句、生动比喻、故事化" class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white">
                </div>
                <div>
                  <label class="block text-xs font-bold text-indigo-300 mb-1.5">Tone · 语气基调</label>
                  <input type="text" data-key="tone" value="${state.values.tone || ""}" placeholder="例如：真诚热情、客观中立、极具说服力" class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white">
                </div>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-indigo-300 mb-1.5">Audience · 目标受众</label>
                  <input type="text" data-key="audience" value="${state.values.audience || ""}" placeholder="例如：零基础技术小白、企业高管" class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white">
                </div>
                <div>
                  <label class="block text-xs font-bold text-indigo-300 mb-1.5">Response · 响应格式</label>
                  <input type="text" data-key="response" value="${state.values.response || ""}" placeholder="例如：分6页输出卡片，每页带主标题" class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white">
                </div>
              </div>
            </div>
          `;
        } else if (fw === "xml") {
          html = `
            <div class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-indigo-300 mb-1.5">&lt;system_role&gt; 角色定义</label>
                <input type="text" data-key="role" value="${state.values.role || ""}" placeholder="定义智能体的身份与核心使命..." class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white">
              </div>
              <div>
                <label class="block text-xs font-bold text-indigo-300 mb-1.5">&lt;context&gt; 上下文与先验知识</label>
                <textarea data-key="insight" rows="2" placeholder="注入背景数据与环境信息..." class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white resize-none">${state.values.insight || ""}</textarea>
              </div>
              <div>
                <label class="block text-xs font-bold text-indigo-300 mb-1.5">&lt;instructions&gt; 核心执行步骤</label>
                <textarea data-key="statement" rows="3" placeholder="明确具体的处理逻辑与约束..." class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white resize-none">${state.values.statement || ""}</textarea>
              </div>
              <div>
                <label class="block text-xs font-bold text-indigo-300 mb-1.5">&lt;rules&gt; 负向约束与安全红线</label>
                <textarea data-key="rules" rows="2" placeholder="1. 严禁胡编乱造；\n2. 遇到不确定必须反问确认..." class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white resize-none">${state.values.rules || ""}</textarea>
              </div>
              <div>
                <label class="block text-xs font-bold text-indigo-300 mb-1.5">&lt;examples&gt; Few-Shot 少样本示范</label>
                <textarea data-key="examples" rows="2" placeholder="Input: ... \nOutput: ..." class="w-full px-3.5 py-2.5 text-xs rounded-xl glass-input text-white font-mono resize-none">${state.values.examples || ""}</textarea>
              </div>
            </div>
          `;
        }

        el.formFields.innerHTML = html;

        // Bind input listeners
        el.formFields.querySelectorAll("[data-key]").forEach(input => {
          input.addEventListener("input", e => {
            state.values[e.target.dataset.key] = e.target.value;
            generateOutput();
          });
        });
      }

      function generateOutput() {
        const v = state.values;
        const fw = state.framework;
        const fmt = state.format;
        let out = "";

        if (fmt === "xml") {
          out += `<system>\n`;
          if (v.capacity || v.role) out += `  <role>${v.capacity ? v.capacity + "，担任" : ""}${v.role || "专家助手"}</role>\n`;
          if (v.personality || v.tone) out += `  <tone>${v.personality || v.tone}</tone>\n`;
          out += `</system>\n\n`;

          if (v.insight || v.context) {
            out += `<context>\n${v.insight || v.context}\n</context>\n\n`;
          }

          if (v.statement || v.objective) {
            out += `<instructions>\n${v.statement || v.objective}\n</instructions>\n\n`;
          }

          if (v.rules) {
            out += `<rules>\n${v.rules}\n</rules>\n\n`;
          }

          if (v.experiment || v.response || v.style) {
            out += `<output_format>\n${[v.experiment, v.response, v.style].filter(Boolean).join("\n")}\n</output_format>\n\n`;
          }

          if (v.examples) {
            out += `<examples>\n${v.examples}\n</examples>\n\n`;
          }

          out += `<input>\n{{在此填入具体业务输入材料}}\n</input>`;
        } else {
          // Markdown Format
          if (fw === "crispe") {
            out += `# Role & Capacity\n你是一名 **${v.capacity || "资深专家"}**，当前担任 **${v.role || "专业顾问"}**。\n\n`;
            if (v.insight) out += `## 1. Insight (背景洞察)\n${v.insight}\n\n`;
            if (v.statement) out += `## 2. Statement (核心任务)\n${v.statement}\n\n`;
            if (v.personality) out += `## 3. Personality (风格调性)\n${v.personality}\n\n`;
            if (v.experiment) out += `## 4. Experiment (输出规范与示例)\n${v.experiment}\n\n`;
            out += `## 5. User Input (待处理材料)\n\`\`\`text\n{{在此粘贴待处理材料}}\n\`\`\``;
          } else if (fw === "costar") {
            out += `# Role Definition\n作为专业的业务与内容专家，请严格遵循以下 CO-STAR 规范执行任务：\n\n`;
            if (v.context) out += `### Context (背景信息)\n${v.context}\n\n`;
            if (v.objective) out += `### Objective (核心目标)\n${v.objective}\n\n`;
            if (v.style) out += `### Style (写作风格)\n${v.style}\n\n`;
            if (v.tone) out += `### Tone (语气基调)\n${v.tone}\n\n`;
            if (v.audience) out += `### Audience (目标受众)\n${v.audience}\n\n`;
            if (v.response) out += `### Response (响应格式)\n${v.response}\n\n`;
            out += `### Input Data\n{{请在此处输入材料}}`;
          } else {
            out += `# System Definition\n角色：${v.role || "专家助手"}\n\n`;
            if (v.insight) out += `## Context\n${v.insight}\n\n`;
            if (v.statement) out += `## Instructions\n${v.statement}\n\n`;
            if (v.rules) out += `## Constraints\n${v.rules}\n\n`;
            if (v.examples) out += `## Few-Shot Examples\n${v.examples}\n\n`;
          }
        }

        el.promptOutput.value = out.trim();
        el.charCount.textContent = out.trim().length;
      }

      function showToast(msg) {
        el.toastMsg.textContent = msg;
        el.toast.classList.remove("opacity-0", "translate-y-4", "pointer-events-none");
        el.toast.classList.add("opacity-100", "translate-y-0");
        setTimeout(() => {
          el.toast.classList.add("opacity-0", "translate-y-4", "pointer-events-none");
          el.toast.classList.remove("opacity-100", "translate-y-0");
        }, 2200);
      }

      function copyText(text) {
        if (!text) return;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast("已成功复制到剪贴板！");
          }).catch(() => fallbackCopy(text));
        } else {
          fallbackCopy(text);
        }
      }

      function fallbackCopy(text) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("已复制到剪贴板！");
      }

      // Bind Framework Switcher
      el.frameworkSwitcher.addEventListener("click", e => {
        const btn = e.target.closest("[data-framework]");
        if (!btn) return;
        state.framework = btn.dataset.framework;
        el.frameworkSwitcher.querySelectorAll("button").forEach(b => {
          if (b === btn) {
            b.classList.add("bg-indigo-600", "text-white", "font-bold");
            b.classList.remove("text-slate-400");
          } else {
            b.classList.remove("bg-indigo-600", "text-white", "font-bold");
            b.classList.add("text-slate-400");
          }
        });
        renderForm();
        generateOutput();
      });

      // Bind Presets
      el.presetBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.preset;
          const p = presets[key];
          if (!p) return;
          state.framework = p.framework;
          state.values = Object.assign({}, p.values);

          // update switcher UI
          el.frameworkSwitcher.querySelectorAll("button").forEach(b => {
            if (b.dataset.framework === p.framework) {
              b.classList.add("bg-indigo-600", "text-white", "font-bold");
              b.classList.remove("text-slate-400");
            } else {
              b.classList.remove("bg-indigo-600", "text-white", "font-bold");
              b.classList.add("text-slate-400");
            }
          });

          renderForm();
          generateOutput();
          showToast(`已加载【${btn.querySelector(".font-bold").textContent.trim()}】模板！`);
        });
      });

      // Format Switchers
      el.tabFmtMarkdown.addEventListener("click", () => {
        state.format = "markdown";
        el.tabFmtMarkdown.classList.add("bg-indigo-600", "text-white", "font-bold");
        el.tabFmtMarkdown.classList.remove("text-slate-400");
        el.tabFmtXml.classList.remove("bg-indigo-600", "text-white", "font-bold");
        el.tabFmtXml.classList.add("text-slate-400");
        generateOutput();
      });

      el.tabFmtXml.addEventListener("click", () => {
        state.format = "xml";
        el.tabFmtXml.classList.add("bg-indigo-600", "text-white", "font-bold");
        el.tabFmtXml.classList.remove("text-slate-400");
        el.tabFmtMarkdown.classList.remove("bg-indigo-600", "text-white", "font-bold");
        el.tabFmtMarkdown.classList.add("text-slate-400");
        generateOutput();
      });

      // Copy Buttons
      el.btnCopyMain.addEventListener("click", () => {
        copyText(el.promptOutput.value);
        el.copyBtnText.textContent = "✅ 已复制！";
        setTimeout(() => el.copyBtnText.textContent = "一键复制 Prompt", 2000);
      });

      el.btnCopySystem.addEventListener("click", () => {
        const v = state.values;
        const sys = `你是 ${v.capacity || "资深专家"}，担任 ${v.role || "专家顾问"}。你的目标是：${v.statement || v.objective || "高效专业地完成业务指令"}。要求：${v.personality || v.tone || "严谨专业"}。`;
        copyText(sys);
      });

      // Reset Button
      el.btnReset.addEventListener("click", () => {
        for (let k in state.values) state.values[k] = "";
        renderForm();
        generateOutput();
        showToast("已清空所有输入！");
      });

      // Init with PRD preset
      const initPreset = presets.prd;
      state.framework = initPreset.framework;
      state.values = Object.assign({}, initPreset.values);
      renderForm();
      generateOutput();

    })();
  </script>
</body>
</html>
