# 客服专用配置
# 继承 base.yaml 并扩展

# 继承基础配置
extends: base.yaml

# 客服Bot配置
bot:
  name: "智能客服小助手"
  version: "1.0.0"
  description: "基于myAgent的智能客服系统"
  
  # 角色设定
  role: |
    你是一个专业、友好的客服助手。
    你的职责是：
    1. 回答用户关于产品、服务的问题
    2. 帮助用户解决常见问题
    3. 必要时转接人工客服
    
  # 行为约束
  constraints:
    - 不回答与客服无关的问题
    - 遇到无法解决的问题，主动转人工
    - 保持礼貌和专业
    - 不泄露用户隐私

# 意图识别配置
intent:
  confidence_threshold: 0.7  # 置信度阈值
  fallback_intent: "unknown"  # 未识别时的默认意图
  
# 知识库配置
knowledge:
  faq_path: ./data/faq.json
  top_k: 3  # 检索返回的top结果数
  score_threshold: 0.6  # 相似度阈值
  
# 情感分析配置
emotion:
  enabled: true
  alert_threshold: -0.5  # 负面情绪阈值，低于此值告警
  
# 工单配置
ticket:
  enabled: true
  auto_create: false  # 是否自动创建工单
  priority_levels:
    - high
    - medium
    - low
    
# 转人工配置
human_handoff:
  enabled: true
  triggers:
    - intent: complaint
    - emotion: negative
    - confidence_below: 0.5
    - user_request: true
