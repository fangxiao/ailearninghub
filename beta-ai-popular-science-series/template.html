<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI科普系列 01</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif; 
            font-size: 18px; 
            color: #333; 
            line-height: 1.6; 
            background: #fafafa; 
            padding: 20px; 
            letter-spacing: 1px;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #fff; 
            padding: 40px 30px; 
            border-radius: 8px; 
            box-shadow: 0 2px 12px rgba(0,0,0,0.06); 
            position: relative;
        }
        
        /* 标题风格 */
        .series-title {
            text-align: center;
            font-size: 14px;
            color: #999;
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        h1 {
            font-size: 28px;
            text-align: center;
            font-weight: bold;
            color: #1a1a1a;
            margin-bottom: 30px;
            line-height: 1.4;
        }
        h2 {
            font-size: 20px;
            font-weight: bold;
            color: #1a1a1a;
            margin: 40px 0 20px;
            padding-left: 15px;
            border-left: 4px solid #e53935;
        }
        
        /* 正文风格 - 短段落、大白话 */
        p {
            padding: 12px 0;
            font-size: 18px;
            color: #444;
            line-height: 1.8;
        }
        
        /* 重点高亮 */
        .highlight {
            background: #fff3cd;
            padding: 16px 20px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 17px;
            color: #856404;
            border-left: 4px solid #ffc107;
        }
        
        /* 吐槽/金句 */
        .quote {
            background: #e3f2fd;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
            font-size: 19px;
            color: #1565c0;
            text-align: center;
            font-weight: bold;
            border-left: 4px solid #2196f3;
        }
        
        /* 类比卡片 */
        .analogy {
            background: #fce4ec;
            padding: 20px;
            border-radius: 6px;
            margin: 20px 0;
            border-left: 4px solid #e91e63;
        }
        .analogy-title {
            font-weight: bold;
            color: #c2185b;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .analogy-content {
            font-size: 17px;
            color: #444;
        }
        
        /* SVG简笔画容器 */
        .svg-container {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
        }
        svg {
            max-width: 100%;
            height: auto;
        }
        .svg-caption {
            font-size: 14px;
            color: #999;
            margin-top: 10px;
            text-align: center;
        }
        
        /* 重点词 */
        .keyword {
            color: #e53935;
            font-weight: bold;
        }
        
        /* 列表 */
        ul {
            margin: 15px 0;
            padding-left: 30px;
        }
        li {
            padding: 8px 0;
            font-size: 17px;
            color: #444;
        }
        
        /* 底部导航 */
        .bottom-nav {
            border-top: 1px dashed #ddd;
            margin-top: 50px;
            padding-top: 30px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }
        .next-article {
            color: #e53935;
            font-weight: bold;
            font-size: 15px;
        }
        
        /* 一句话总结 */
        .summary {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 6px;
            margin: 30px 0;
            text-align: center;
        }
        .summary-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 8px;
        }
        .summary-content {
            font-size: 18px;
            color: #333;
            font-weight: bold;
        }
        
        /* 目录导航 */
        .series-nav {
            text-align: center;
            padding-top: 20px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="series-title">AI科普系列</div>
        <h1>【标题】</h1>
        
        <!-- 简笔画插图 -->
        <div class="svg-container">
            <svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
                <!-- 极简人物 -->
                <circle cx="200" cy="120" r="40" fill="#fff" stroke="#333" stroke-width="3"/>
                <circle cx="185" cy="115" r="3" fill="#333"/>
                <circle cx="215" cy="115" r="3" fill="#333"/>
                <path d="M190 130 Q200 140 210 130" stroke="#333" stroke-width="2" fill="none"/>
                <rect x="150" y="160" width="100" height="120" fill="#fff" stroke="#333" stroke-width="3"/>
                <line x1="160" y1="160" x2="160" y2="280" stroke="#333" stroke-width="3"/>
                <line x1="240" y1="160" x2="240" y2="280" stroke="#333" stroke-width="3"/>
                <line x1="150" y1="200" x2="250" y2="200" stroke="#333" stroke-width="2"/>
                <!-- 装饰元素 -->
                <circle cx="80" cy="80" r="15" fill="#e53935" opacity="0.2"/>
                <circle cx="320" cy="220" r="20" fill="#2196f3" opacity="0.2"/>
                <path d="M50 250 Q100 230 150 250" stroke="#ddd" stroke-width="2" fill="none"/>
            </svg>
        </div>
        
        <!-- 正文内容 -->
        <p>【正文第一段】</p>
        
        <div class="analogy">
            <div class="analogy-title">🤔 打个比方</div>
            <div class="analogy-content">【类比内容】</div>
        </div>
        
        <p>【更多正文】</p>
        
        <h2>一、小标题</h2>
        
        <p>【内容】</p>
        
        <div class="quote">💡 一句话搞懂：【金句】</div>
        
        <div class="highlight">
            <strong>划重点：</strong><br>
            【重点内容】
        </div>
        
        <!-- 一句话总结 -->
        <div class="summary">
            <div class="summary-title">📝 一句话总结</div>
            <div class="summary-content">【总结内容】</div>
        </div>
        
        <!-- 底部导航 -->
        <div class="bottom-nav">
            <p class="next-article">下期预告：【下一篇标题】</p>
        </div>
        
        <div class="series-nav">
            <p>AI科普系列 · 共12篇</p>
        </div>
    </div>
</body>
</html>
