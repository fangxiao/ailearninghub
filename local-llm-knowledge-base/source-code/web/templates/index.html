<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地大模型知识库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-box {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.6;
        }

        .user .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .ai .message-content {
            background: white;
            color: #333;
            border: 1px solid #e9ecef;
            border-bottom-left-radius: 4px;
        }

        .sources {
            margin-top: 8px;
            font-size: 12px;
            color: #666;
            padding-left: 4px;
        }

        .sources-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .source-item {
            margin-bottom: 4px;
            padding: 4px 8px;
            background: #e9ecef;
            border-radius: 4px;
            font-size: 11px;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 12px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .input-area button:hover {
            background: #5a6fd6;
        }

        .input-area button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .loading {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .loading::after {
            content: '';
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .info-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .info-panel h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #333;
        }

        .doc-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .doc-tag {
            padding: 4px 12px;
            background: #e9ecef;
            border-radius: 16px;
            font-size: 12px;
            color: #666;
        }

        .rebuild-btn {
            margin-top: 12px;
            padding: 8px 16px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
        }

        .rebuild-btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>本地大模型知识库</h1>
            <p>数据不出域 · 隐私有保障 · 完全本地化部署</p>
        </div>

        <div class="chat-box">
            <div class="messages" id="messages">
                <div class="message ai">
                    <div class="message-content">
                        你好！我是你的本地知识库助手。请提问，我将根据知识库内容为你提供答案。
                    </div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="query-input" placeholder="输入你的问题..." autocomplete="off">
                <button id="send-btn" onclick="sendQuery()">发送</button>
            </div>
        </div>

        <div class="info-panel">
            <h3>知识库文档</h3>
            <div class="doc-list" id="doc-list">
                <span class="doc-tag">加载中...</span>
            </div>
            <button class="rebuild-btn" onclick="rebuildKnowledgeBase()">重建知识库</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const queryInput = document.getElementById('query-input');
        const sendBtn = document.getElementById('send-btn');
        const docList = document.getElementById('doc-list');

        queryInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendQuery();
            }
        });

        function addMessage(content, type, sources = []) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            let sourcesHtml = '';
            if (sources.length > 0) {
                sourcesHtml = `
                    <div class="sources">
                        <div class="sources-title">参考来源：</div>
                        ${sources.map(s => `<div class="source-item">[${s.index}] ${s.content}</div>`).join('')}
                    </div>
                `;
            }
            
            messageDiv.innerHTML = `
                <div class="message-content">${content}</div>
                ${sourcesHtml}
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async function sendQuery() {
            const query = queryInput.value.trim();
            if (!query) return;

            addMessage(query, 'user');
            queryInput.value = '';
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<span class="loading">思考中</span>';

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();
                addMessage(data.answer, 'ai', data.sources || []);
            } catch (error) {
                addMessage('抱歉，查询失败：' + error.message, 'ai');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '发送';
            }
        }

        async function loadDocuments() {
            try {
                const response = await fetch('/api/documents');
                const data = await response.json();
                
                if (data.documents.length === 0) {
                    docList.innerHTML = '<span class="doc-tag">暂无文档</span>';
                } else {
                    docList.innerHTML = data.documents.map(doc => 
                        `<span class="doc-tag">${doc}</span>`
                    ).join('');
                }
            } catch (error) {
                docList.innerHTML = '<span class="doc-tag">加载失败</span>';
            }
        }

        async function rebuildKnowledgeBase() {
            const btn = document.querySelector('.rebuild-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '重建中...';
            btn.disabled = true;

            try {
                await fetch('/api/rebuild', { method: 'POST' });
                alert('知识库重建成功！');
                loadDocuments();
            } catch (error) {
                alert('重建失败：' + error.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        loadDocuments();
    </script>
</body>
</html>
